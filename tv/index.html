<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TV · Barkhad</title>
<meta name="description" content="Live TV and on-demand streaming.">

<!--
  GitHub Pages cannot set response headers, so the CSP lives here.
  Limits of meta CSP: no frame-ancestors, no report-uri, no sandbox.
  Those three require the Cloudflare Transform Rule (see notes).
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://cdn.jsdelivr.net;
  style-src 'self';
  img-src 'self' data: https:;
  media-src 'self' blob: https:;
  connect-src 'self' https:;
  worker-src 'self' blob:;
  font-src 'self';
  object-src 'none';
  base-uri 'none';
  form-action 'none';
  upgrade-insecure-requests">

<meta name="theme-color" content="#0f1117">
<link rel="icon" href="../Assets/images/logo.png">
<link rel="stylesheet" href="styles.css">

<!--
  hls.js pinned to 1.7.3. Do NOT use @latest — that executes whatever
  the maintainers publish next, with full origin privileges.

  To enable SRI, generate the hash once and paste it in:

    curl -sL https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js \
      | openssl dgst -sha384 -binary | openssl base64 -A

  Then uncomment the integrity attribute below and test in a private
  window BEFORE deploying. A wrong hash blocks the script entirely.
-->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"
        crossorigin="anonymous" defer></script>
<!-- integrity="sha384-PASTE_HASH_HERE" -->
<script src="app.js" defer></script>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>
<h1 class="sr-only">Live TV</h1>

<nav>
  <div class="nav-inner">
    <a href="/" class="nav-brand">Barkhad<span>.</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/tv/" class="active" aria-current="page">TV</a>
    </div>
    <div class="nav-status">
      <span class="status-dot" id="status-dot" aria-hidden="true"></span>
      <span id="status-text" aria-live="polite">Loading…</span>
    </div>
  </div>
</nav>

<main id="main">

  <div class="toolbar">
    <div class="tabs" id="tabs" role="tablist" aria-label="Categories">
      <button class="tab active" data-tab="all" role="tab" aria-selected="true">
        All <span class="tab-count" id="count-all">0</span></button>
      <button class="tab" data-tab="favorites" role="tab" aria-selected="false">
        ★ Favorites <span class="tab-count" id="count-favorites">0</span></button>
      <button class="tab" data-tab="live" role="tab" aria-selected="false">
        Live TV <span class="tab-count" id="count-live">0</span></button>
      <button class="tab" data-tab="movies" role="tab" aria-selected="false">
        Movies <span class="tab-count" id="count-movies">0</span></button>
      <button class="tab" data-tab="series" role="tab" aria-selected="false">
        Series <span class="tab-count" id="count-series">0</span></button>
      <button class="tab" data-tab="animation" role="tab" aria-selected="false">
        Animation <span class="tab-count" id="count-animation">0</span></button>
    </div>

    <div class="search">
      <label for="search" class="sr-only">Search channels, movies, series</label>
      <input type="text" id="search" placeholder="Search channels, movies, series…">
    </div>

    <label class="toggle">
      <input type="checkbox" id="hide-offline">
      Hide dead links
    </label>

    <div class="profiles">
      <label for="profile-select" class="sr-only">Switch profile</label>
      <select id="profile-select"></select>
      <button class="icon-btn" id="profile-new" title="New profile"
              aria-label="New profile">＋</button>
      <button class="icon-btn" id="profile-delete" title="Delete current profile"
              aria-label="Delete current profile">🗑</button>
    </div>
  </div>

  <div class="layout">
    <div class="player-col">
      <div class="player">
        <video id="video" controls playsinline></video>
        <div class="placeholder" id="placeholder" role="status">
          <div class="icon" aria-hidden="true">📡</div>
          <div>Pick something to watch</div>
        </div>
      </div>

      <div class="now-playing">
        <div class="np-info">
          <div class="np-title" id="np-title">Nothing playing</div>
          <div class="np-group" id="np-group">Select from the list →</div>
        </div>
        <div class="np-actions">
          <label for="quality" class="sr-only">Video quality</label>
          <select class="quality-select" id="quality" disabled>
            <option value="auto">Auto</option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
            <option value="360">360p</option>
          </select>
        </div>
      </div>

      <div class="controls">
        <button class="btn" id="prev" disabled>← Prev</button>
        <button class="btn" id="next" disabled>Next →</button>
        <button class="btn primary" id="download" disabled>⬇ Download</button>
      </div>
    </div>

    <aside class="sidebar" aria-labelledby="list-title">
      <div class="sidebar-header">
        <h2 class="sidebar-title" id="list-title">Channels</h2>
        <span class="sidebar-count" id="list-count">0</span>
      </div>
      <div class="channel-list" id="list">
        <div class="empty">
          <div class="spinner" aria-hidden="true"></div>
          <p class="loading-note">Loading playlist…</p>
        </div>
      </div>
    </aside>
  </div>

</main>

<!-- New profile modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 class="modal-title" id="modal-title">New profile</h2>
    <label for="modal-input" class="sr-only">Profile name</label>
    <input type="text" id="modal-input" placeholder="Profile name" maxlength="24">
    <div class="modal-actions">
      <button class="btn" id="modal-cancel">Cancel</button>
      <button class="btn primary" id="modal-create">Create</button>
    </div>
  </div>
</div>

<div class="download-bar" id="download-bar">
  <div class="bar-header">
    <span class="bar-title" id="dl-title">Downloading…</span>
    <button class="btn btn-sm" id="dl-cancel">Cancel</button>
  </div>
  <div class="bar-track"><div class="bar-fill" id="dl-fill"></div></div>
  <div class="bar-status" id="dl-status">0%</div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

</body>
</html>
